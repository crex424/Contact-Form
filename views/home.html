<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/contact-form.css">
    <link rel="shortcut icon" href="images/wrench-icon.jpg" type="image/x-icon">
    <script src="scripts/home-script.js" defer></script>
    <title>Contact Form</title>
</head>
<body>
    <div id="main">
        <h1 id="header">Contact Form</h1>
        <form action="#" method="get" id="contact-form">
            <div id="row-one">
                <div class="content">
                    <div class="label-err">
                        <label for="fname">First Name</label>
                        <span id="err-fname" class="err">Please enter your first name!</span>
                    </div>
                    <input type="text" name="fname" id="fname">
                </div>
                <div class="content">
                    <div class="label-err">
                        <label for="lname">Last Name</label>
                        <span id="err-lname" class="err">Please enter your last name!</span>
                    </div>
                    <input type="text" name="lname" id="lname">
                </div>
                <div class="content">
                    <label for="job-title">Job Title</label>
                    <input type="text" name="job-title" id="job-title">
                </div>
            </div>
            <div id="row-two">
                 <div class="content">
                    <label for="company">Company</label>
                    <input type="text" name="company" id="company">
                 </div>
                
                  <div class="content">
                    <div class="label-err">
                        <label for="linkedin">Linkedin URL</label>
                        <span id="err-linkedin" class="err">Please enter a valid Linkedin link!</span>
                    </div>
                    <input type="text" name="linkedin" id="linkedin">
                  </div>
                
                <div class="content">
                    <div class="label-err">
                        <label for="email">Email Address</label>
                        <span id="err-email" class="err">Please enter a valid email!</span>
                    </div>
                    <input type="text" name="email" id="email">
                </div>
            </div>
            <div id="row-three">
                <div class="content">
                    <div class="label-err">
                        <label for="meet">How did we meet?</label>
                        <span id="err-meet" class="err">Please select how we met!</span>
                    </div>
                    <select name="meet" id="meet">
                        <option value="none">Please select</option>
                        <option value="person">In person</option>
                        <option value="work">Work</option>
                        <option value="school">School</option>
                    </select>
                </div>
                
                <div class="content">
                    <label for="other">Other (please specify)</label>
                    <textarea rows="1" name="other" id="other"></textarea>
                </div>
            </div>
            <label for="message">Message</label>
            <textarea rows="5" name="message" id="message"></textarea>
            <div id="check-box">
                <label for="mailing-list">
                <input type="checkbox" id="mailing-list" name="mailing-list" value="mailing-list">
                Please add me to your mailing list
                </label>
            </div>
            <div id="radio-btns">
                <label for="html">
                    Choose an email format:
                    <input type="radio" id="html" class="eformat" name="method" value="HTML">
                    HTML
                </label>
                <label for="text-format">
                    <input type="radio" id="text-format" class="eformat" name="method" value="text">
                    Text
                </label>
            </div>
            <div id="submit-bn">
                <button type="submit">Submit</button>
            </div>
            
        </form>
    </div>
</body>
</html>
