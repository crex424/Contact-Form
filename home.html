<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/contact-form.css">
    <link rel="shortcut icon" href="images/wrench-icon.jpg" type="image/x-icon">
    <title>Contact Form</title>
</head>
<body>
    <div id="header">
        <h1>Contact Form</h1>
    </div>

    <div id="main">
        <div id="contact-form">
            <form action="">
                <label for="fname">First Name</label>
                <input type="text" name="fname" id="fname">

                <label for="lname">Last Name</label>
                <input type="text" name="lname" id="lname">

                <label for="job-title">Job Title</label>
                <input type="text" name="job-title" id="job-title">

                <label for="company">Company</label>
                <input type="text" name="company" id="company">

                <label for="linkedin">Linkedin URL</label>
                <input type="url" name="linkedin" id="linkedin">

                <label for="email">Email Address</label>
                <input type="email" name="email" id="email">

                <label for="meet">How did we meet?</label>
                <select name="meet" id="meet">
                    <option value="none">Please select</option>
                    <option value="person">In person</option>
                    <option value="work">Work</option>
                    <option value="school">School</option>
                </select>

                <label for="other">Other (please specify)</label>
                <textarea rows="1" name="other" id="other"></textarea>
                
                <label for="message">Message</label>
                <textarea rows="5" name="message" id="message"></textarea>

                <label for="mailing-list">
                    <input type="checkbox" id="mailing-list" name="mailing-list" value="mailing-list">
                    Please add me to your mailing list
                </label>

                <label for="eformat">
                    Choose an email format:
                    <input type="radio" id="html" class="eformat" name="method" value="eformat">
                    HTML
                    <input type="radio" id="text" class="eformat" name="method" value="eformat">
                    Text
                </label>

                <button type="submit" id="submit-bn">Submit</button>
            </form>
        </div>


    </div>
</body>
</html>
